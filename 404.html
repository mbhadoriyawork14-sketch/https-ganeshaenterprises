<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Ganesha Enterprises</title>
  <link rel="icon" type="image/svg+xml" href="assets/imgs/logo/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .error-hero {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
      background: radial-gradient(circle at 50% 30%, rgba(94, 23, 235, 0.08), transparent 70%);
    }
    .error-card {
      max-width: 580px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 48px 36px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.06);
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      color: #5E17EB;
      line-height: 1;
      margin-bottom: 16px;
      letter-spacing: -2px;
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 12px;
    }
    .error-desc {
      font-size: 1rem;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .error-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #5E17EB;
      color: #ffffff;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .error-btn:hover {
      background: #470eb8;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(94, 23, 235, 0.25);
    }
  </style>
</head>
<body>
  <div class="error-hero">
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">The printing service, product, or page you were looking for doesn't exist or has moved. Return to our homepage to explore our full suite of print and merchandise solutions.</p>
      <a href="index.html" class="error-btn">
        <i class="fa-solid fa-house"></i>
        <span>Back to Homepage</span>
      </a>
    </div>
  </div>
</body>
</html>
